[project]
name = "destektesvik"
version = "0.1.0"
description = "DestekTesvik MVP - deterministic support-program eligibility engine"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi~=0.141.1",
  "uvicorn[standard]~=0.52.3",
  "jinja2~=3.1.6",
  "pydantic~=2.13.4",
  "pydantic-settings~=2.15.0",
  "sqlalchemy~=2.0.52",
  "alembic~=1.19.1",
  "psycopg[binary]~=3.3.4",
  "argon2-cffi~=25.1.0",
  "itsdangerous~=2.2.0",
  "python-multipart~=0.0.32",
  "httpx~=0.28.1",
]

[dependency-groups]
dev = [
  "pytest~=9.1.1",
  "ruff~=0.16.3",
  "mypy~=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/destektesvik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: requires a live PostgreSQL instance (DESTEKTESVIK_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["destektesvik", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
# FastAPI's dependency injection is expressed as call-in-default; that is the
# framework's idiom, not a mutable-default bug.
"src/destektesvik/delivery/routers/*.py" = ["B008"]
"src/destektesvik/delivery/deps.py" = ["B008"]
# Migrations issue DDL that PostgreSQL cannot parameterise (table names, role
# names, policy bodies). The only interpolated value is a deployment-configured
# role name, validated against an identifier regex before use.
"migrations/versions/*.py" = ["S608"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
